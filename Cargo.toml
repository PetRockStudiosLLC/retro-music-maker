[package]
name = "nodetune"
version = "3.0.0"
description = "Node-based retro music creation"
authors = ["you"]
edition = "2021"

[lib]
name = "nodetune_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
 serde = { version = "1", features = ["derive"] }
 serde_json = "1"
 parking_lot = "0.12"
 cpal = "0.15"
  hound = "3"
  fastrand = "2"
  rand = "0.8"
 crossbeam-channel = "0.5"
 log = "0.4"
 env_logger = "0.11"
 tokio = { version = "1", features = ["full"] }
 mlua = { version = "0.9", features = ["lua54", "vendored"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
