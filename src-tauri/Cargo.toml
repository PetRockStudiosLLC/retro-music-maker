[package]
name = "nodetune-tauri"
version = "3.0.0"
description = "Node-based retro music creation"
authors = ["you"]
edition = "2021"

[dependencies]
nodetune-lib = { package = "nodetune", path = ".." }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2.4.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
